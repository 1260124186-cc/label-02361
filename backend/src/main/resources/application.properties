# ===================================================================
# 工厂生产同步系统 - 运行时配置
# 配置优先级: 命令行 > 环境变量 > application.properties > 默认值
# ===================================================================

# 经理每日间隔时间（毫秒）
manager.interval.ms=1000

# 组长制造耗时（毫秒）- 作为默认值，可被 production-types 配置覆盖
team-leader.manufacturing.ms=1500

# 关闭时线程等待超时时间（毫秒）
shutdown.join.timeout.ms=3000

# 生产类型数量（当没有配置文件时使用）
production.types=5

# 日志级别: TRACE, DEBUG, INFO, WARN, ERROR
log.level=INFO
