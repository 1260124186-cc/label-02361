# ===================================================================
# 工厂生产同步系统 - 运行时配置
# 配置优先级: 命令行 > 环境变量 > application.properties > 默认值
# ===================================================================

# 经理每日间隔时间（毫秒）
manager.interval.ms=1000

# 组长制造耗时（毫秒）- 作为默认值，可被 production-types 配置覆盖
team-leader.manufacturing.ms=1500

# 关闭时线程等待超时时间（毫秒）
shutdown.join.timeout.ms=3000

# 生产类型数量（当没有配置文件时使用）
production.types=5

# 日志级别: TRACE, DEBUG, INFO, WARN, ERROR
log.level=INFO

# ===================================================================
# 团队成员子流程配置
# ===================================================================

# 团队成员数量
team.size=3

# 每个任务所需人数
task.required.people=2

# 产能不足策略: wait（等待）, alert（告警继续）, fail（失败）
capacity.strategy=wait

# 等待可用成员超时时间（毫秒），0 表示无限等待
capacity.wait.timeout.ms=0

# 是否使用线程池执行子任务
task.use.thread.pool=true

# 线程池大小
task.thread.pool.size=5

# 排产策略: round-robin, random, priority, demand-driven
schedule.strategy=round-robin
